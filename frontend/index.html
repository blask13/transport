<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Transport MVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 70vh; }
    #panel {
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .match {
      border: 1px solid #ddd;
      margin-bottom: 8px;
      padding: 8px;
    }
    button {
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="panel">
  <h3>Propozycje</h3>
  <div id="hint" style="margin-bottom:8px;color:#555;"></div>
  <button onclick="startRouteMode()">🗺️ Rysuj trasę (kurier)</button>
  <button onclick="startParcelMode()">📦 Rysuj paczkę (nadawca)</button>
  <hr/>  
  <button onclick="propose()">🔍 Szukaj propozycji</button>
  <div id="matches"></div>
</div>

<script>
  function setHint(text) {
    document.getElementById("hint").innerText = text || "";
  }    
const API_BASE = "http://localhost:8000";
let ROUTE_ID = null;

const map = L.map("map").setView([52, 20], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap"
}).addTo(map);

map.on("click", (e) => {
  if (!clickMode || tempPoints.length >= 2) return;

  tempPoints.push(e.latlng);

  tempMarkers.push(
    L.marker(e.latlng)
      .addTo(map)
      .bindPopup(`${clickMode.toUpperCase()} #${tempPoints.length}`)
      .openPopup()
  );

  if (clickMode === "route" && tempPoints.length === 2) {
    createRouteFromPoints();
  }

  if (clickMode === "parcel" && tempPoints.length === 2) {
    createParcelFromPoints();
  }
});

let routeLayer;
let pickupLayers = [];
let dropLayers = [];

let clickMode = null; // "route" | "parcel"
let tempPoints = [];
let tempMarkers = [];
function clearLayers() {
  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }    
  pickupLayers.forEach(l => map.removeLayer(l));
  dropLayers.forEach(l => map.removeLayer(l));
  pickupLayers = [];
  dropLayers = [];
}

function resetTemp() {
  tempPoints = [];
  tempMarkers.forEach(m => map.removeLayer(m));
  tempMarkers = [];
  clickMode = null;
}

function startRouteMode() {
  resetTemp();
  clickMode = "route";
  setHint("Kliknij START i END trasy na mapie");
}

function startParcelMode() {
  resetTemp();
  clickMode = "parcel";
  setHint("Kliknij PICKUP i DROP paczki na mapie");
}

async function createRouteFromPoints() {
  const [start, end] = tempPoints;

  const r = await fetch(`${API_BASE}/routes`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      courier_id: 1,
      title: "Trasa z mapy",
      start: { lng: start.lng, lat: start.lat },
      end:   { lng: end.lng, lat: end.lat }
    })
  });

  const data = await r.json();
  ROUTE_ID = data.id;
  resetTemp();
  setHint("");
  await loadRoute();
  await loadMatches();
}

async function createParcelFromPoints() {
  const [pickup, drop] = tempPoints;

  const r = await fetch(`${API_BASE}/parcels`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sender_id: 2,
      pickup: { lng: pickup.lng, lat: pickup.lat },
      drop:   { lng: drop.lng, lat: drop.lat }
    })
  });

  const data = await r.json();
  alert(`Utworzono paczkę ID=${data.id}`);
  resetTemp();
  setHint("");
  await propose();
}

async function createTestRoute() {
  const r = await fetch(`${API_BASE}/routes`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      courier_id: 1,
      title: "Testowa trasa",
      start: { lng: 21.0122, lat: 52.2297 },   // Warszawa
      end:   { lng: 19.4550, lat: 51.7592 }    // Łódź
    })
  });

  const data = await r.json();
  alert(`Utworzono trasę ID=${data.id}`);
  location.reload();
}

async function createTestParcel() {
  const r = await fetch(`${API_BASE}/parcels`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sender_id: 2,
      pickup: { lng: 20.2, lat: 52.1 },
      drop:   { lng: 19.8, lat: 51.8 }
    })
  });

  const data = await r.json();
  alert(`Utworzono paczkę ID=${data.id}`);
}

async function loadRoute() {
  const r = await fetch(`${API_BASE}/routes/${ROUTE_ID}`);
  const data = await r.json();

  routeLayer = L.geoJSON(data.geom, {
    style: { color: "blue", weight: 4 }
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds());
}

async function loadMatches() {
  const r = await fetch(`${API_BASE}/routes/${ROUTE_ID}/matches`);
  const data = await r.json();

  const container = document.getElementById("matches");
  container.innerHTML = "";

  clearLayers();

  for (const m of data.items) {
    const pickup = L.geoJSON(m.pickup_point, {
      pointToLayer: (_, latlng) =>
        L.circleMarker(latlng, { color: "green", radius: 6 })
    }).addTo(map);

    const drop = L.geoJSON(m.drop_point, {
      pointToLayer: (_, latlng) =>
        L.circleMarker(latlng, { color: "red", radius: 6 })
    }).addTo(map);

    pickupLayers.push(pickup);
    dropLayers.push(drop);

    const div = document.createElement("div");
    div.className = "match";
    div.innerHTML = `
      <strong>Match #${m.id}</strong><br/>
      Δ dystans: ${(m.delta_distance_m/1000).toFixed(1)} km<br/>
      Δ czas: ${(m.delta_duration_s/60).toFixed(0)} min<br/>
      <button onclick="acceptMatch(${m.id})">ACCEPT</button>
    `;
    container.appendChild(div);
  }
}
async function propose() {
  if (!ROUTE_ID) {
    alert("Najpierw narysuj trasę");
    return;
  }    
  const r = await fetch(`${API_BASE}/routes/${ROUTE_ID}/propose`, {
    method: "POST"
  });

  if (!r.ok) {
    alert("Błąd przy liczeniu propozycji");
    return;
  }

  await loadMatches();
}

async function acceptMatch(matchId) {
  if (!confirm("Na pewno zaakceptować tę paczkę?")) return;

  const r = await fetch(`${API_BASE}/routes/matches/${matchId}/accept`, {
    method: "POST"
  });

  if (!r.ok) {
    alert("Błąd przy accept");
    return;
  }

  alert("Zaakceptowano. Trasa zaktualizowana.");
  await loadRoute();
  await loadMatches();
}

// INIT
(async function init() {
  await loadRoute();
  await loadMatches();
})();
</script>

</body>
</html>
