<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Transport MVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 70vh; }
    #panel {
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .match {
      border: 1px solid #ddd;
      margin-bottom: 8px;
      padding: 8px;
    }
    button {
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="panel">
  <h3>Propozycje</h3>
  <div id="hint" style="margin-bottom:8px;color:#555;"></div>
  <button onclick="startRouteMode()">🗺️ Rysuj trasę (kurier)</button>
  <button onclick="startParcelMode()">📦 Rysuj paczkę (nadawca)</button>
  <button onclick="showMyRoutes()">📍 Moje trasy</button>
  <button onclick="loadMyParcels()">📦 Moje paczki</button>
  <button onclick="confirmDraw()">✅ Zatwierdź</button>
  <button onclick="cancelDraw()">❌ Anuluj</button>
  <hr/>  
  <button onclick="propose()">🔍 Szukaj propozycji</button>
  <div id="matches"></div>
  <hr/>
  <h3 style="margin:8px 0;">📦 Moje paczki</h3>
  <div id="parcels"></div>  
</div>

<script src="app.js"></script>

</body>
</html>
